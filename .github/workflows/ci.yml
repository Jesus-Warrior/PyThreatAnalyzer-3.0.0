name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install native ssdeep build dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuzzy-dev build-essential
      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements-dev.txt -r requirements-fuzzy.in
      - name: Ensure both fuzzy backends are available
        run: python -c 'import tlsh, ssdeep'
      - name: Check release consistency
        run: ./scripts/check-consistency.sh
      - name: Validate offline data fixtures
        run: ./scripts/check-data-coverage.sh --ci
      - name: Enforce release data coverage
        run: ./scripts/check-data-coverage.sh --release
      - name: Run legacy functional suite
        run: python test_pythreatanalyzer.py
      - name: Run pytest
        run: python -m pytest
      - name: Verify and package
        run: python verificar_y_empaquetar.py --tests --zip-name PyThreatAnalyzer_v3.0.0.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: pythreatanalyzer-py${{ matrix.python-version }}
          path: PyThreatAnalyzer_v3.0.0.zip
          if-no-files-found: warn
